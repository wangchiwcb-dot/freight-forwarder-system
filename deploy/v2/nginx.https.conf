server {
  listen 80;
  server_name 47.82.68.65;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    try_files $uri =404;
    default_type text/plain;
  }
  location / { return 308 https://47.82.68.65$request_uri; }
}

server {
  listen 443 ssl;
  # This listener is published only on the host loopback for maintenance.
  listen 8080;
  server_name 47.82.68.65;
  ssl_certificate /etc/letsencrypt/live/freight-quotes-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/freight-quotes-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:freightTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  gzip on;
  gzip_static on;
  gzip_comp_level 6;
  send_timeout 180s;
  sendfile_max_chunk 64k;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  location /api/v2/ {
    proxy_pass http://api:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location /api/ { return 404; }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}

